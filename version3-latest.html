<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>修学旅行のしおり｜湯布院・別府</title>
<style>html,body{margin:0;background:#e9ecef;color:#26323d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}body:before{content:"しおりを読み込み中…";display:block;padding:40px 20px;text-align:center;color:#66727c;font-size:13px}</style>
</head>
<body>
<script>
(async()=>{
  const html=await (await fetch('version3.html',{cache:'no-store'})).text();
  const doc=new DOMParser().parseFromString(html,'text/html');

  const cover=doc.querySelector('.cover');
  if(cover){
    const purpose=doc.createElement('section');
    purpose.className='sheet';
    purpose.id='purpose';
    purpose.innerHTML=`
      <div class="head"><h2>旅の目的</h2><div class="area">本旅行の実施意義<br>および基本方針</div></div>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        本旅行は、二つの家族と二名の大人が日常生活の場を離れ、湯布院および別府での観光、食事、宿泊、移動その他の共同体験をともにすることにより、参加者相互の交流を深め、家族という単位を越えて同じ時間を共有する機会をつくることを目的とする。普段とは異なる環境の中で、同じ景色を見て、同じ食事を囲み、同じ出来事を経験することにより、大人同士だけでなく子どもを含む参加者全員にとって、後から振り返ることのできる共通の記憶を残すことを大切にする。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        特に子どもについては、大人の予定や都合のみを優先するのではなく、安全の確保を最優先としたうえで、年齢やその時々の体調、疲労、空腹、眠気、気分等に十分配慮し、無理のない速度で旅行を進めるものとする。移動、食事、休憩、遊びの時間についても、子どもが安心して過ごし、自分なりに旅行を楽しむことができるよう、大人全員が必要に応じて声を掛け合い、見守りや補助を行う。また、観光地や遊園地での体験を単に予定を消化するためのものとせず、子ども自身が興味を持ったこと、楽しかったこと、初めて経験したことを大切にし、それぞれにとって良い思い出として残る時間をつくることを目指す。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        大人については、各家庭の保護者だけに子どもの対応を委ねるのではなく、参加者全員が一つの旅行グループとして協力し、安全確認、移動時の補助、荷物、食事、休憩、周囲への配慮等を可能な範囲で分担する。家族で参加する者と個人で参加する者という立場の違いにかかわらず、それぞれが無理なく過ごせることを前提とし、誰か一人に負担が偏らないよう互いの状況を確認しながら行動する。予定変更や休憩の追加が必要となった場合についても、当初の計画を守ること自体を目的とせず、その時点での参加者全員の安全、体調および快適さを踏まえて柔軟に判断する。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0;">
        本旅行における最も重要な到達目標は、すべての予定を完全に実行することではなく、大人も子どももそれぞれの立場で安心して楽しみ、参加者全員が無事に帰宅することである。そのうえで、家族同士の交流がこれまで以上に深まり、子どもたちにとっても「みんなで旅行に行った」という実感と楽しい記憶が残り、大人にとっても日常とは異なる時間を共有したことが今後の関係をより良くするきっかけとなることを、本旅行の最終的な目的とする。
      </p>`;
    cover.insertAdjacentElement('afterend',purpose);
  }

  const pack=doc.querySelector('.pack');
  if(pack){
    const items=[...pack.children];
    if(items.length>=11){
      const order=[0,1,2,3,4,8,9,10,5,6,7];
      order.forEach(i=>pack.appendChild(items[i]));
    }
  }
  const ver=doc.querySelector('.version');
  if(ver) ver.textContent='VERSION 3 / LATEST';
  doc.querySelectorAll('script').forEach(s=>s.remove());
  document.head.innerHTML=doc.head.innerHTML;
  document.body.innerHTML=doc.body.innerHTML;
  const names=['group_trip','excited','travel_guide','happy_man','discussion'];
  const ill={};
  await Promise.all(names.map(async n=>{
    const b64=(await (await fetch(`assets/${n}.b64`)).text()).trim();
    ill[n]=`data:image/webp;base64,${b64}`;
  }));
  document.querySelectorAll('img[data-ill]').forEach(img=>{img.src=ill[img.dataset.ill]||'';});
})();
</script>
</body>
</html>
