<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>修学旅行のしおり｜湯布院・別府</title>
<style>html,body{margin:0;background:#e9ecef;color:#26323d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}body:before{content:"しおりを読み込み中…";display:block;padding:40px 20px;text-align:center;color:#66727c;font-size:13px}</style>
</head>
<body>
<script>
(async()=>{
  const html=await (await fetch('version3.html',{cache:'no-store'})).text();
  const doc=new DOMParser().parseFromString(html,'text/html');

  const cover=doc.querySelector('.cover');
  if(cover){
    const purpose=doc.createElement('section');
    purpose.className='sheet';
    purpose.id='purpose';
    purpose.innerHTML=`
      <div class="head"><h2>旅の目的</h2><div class="area">本旅行の実施意義<br>および基本方針</div></div>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        本旅行は、二つの家族および単身で参加する二名の大人が、日常生活の場を一時的に離れ、湯布院および別府における観光、食事、宿泊、移動、遊びその他の共同体験を通じて、参加者相互の親睦を深めるとともに、家族という単位や普段の生活環境を越えて同じ時間を共有することを目的として実施するものである。日頃はそれぞれ異なる生活リズムや家庭環境の中で過ごしている参加者が、一つの旅行グループとして同じ目的地へ向かい、同じ景色を見て、同じ場所で食事をし、同じ出来事を経験することにより、通常の食事会や短時間の集まりだけでは得ることのできない、より深い交流の機会をつくることを基本的な目的とする。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        また、本旅行においては、単に観光地を巡り、予定された施設を利用することだけを目的とするのではなく、出発から帰宅までの一連の時間そのものを参加者全員で共有することを重視する。移動中の会話、食事場所の選択、休憩の取り方、予定変更に対する判断、宿泊先での過ごし方など、旅行中に生じる一つひとつの出来事を含めて共同体験として捉え、それぞれの立場や考え方を尊重しながら、無理なく協力して行動することを大切にする。その過程を通じて、大人同士の関係をより深めるとともに、家族同士の交流や子どもを含めた参加者全体のつながりを育み、今後も自然に集まり、互いに関わり合うことのできる関係を築く一つの機会とする。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        特に子どもについては、大人の予定や都合、観光地をできるだけ多く回ること、予定どおりの時刻で行動することを一方的に優先するのではなく、子どもの安全、健康、体調および心理的な安心を最優先とする。年齢や体力には個人差があり、大人にとって問題のない移動時間や待ち時間であっても、子どもにとっては大きな負担となる場合があることを参加者全員が認識し、疲労、空腹、眠気、暑さ、寒さ、機嫌、緊張、興奮その他の状態を継続的に確認しながら、その時点で最も無理のない方法を選択するものとする。必要に応じて予定を短縮し、休憩時間を増やし、食事や水分補給を優先するなど、計画よりも実際の状態を重視した柔軟な対応を行う。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        子どもにとって本旅行が楽しい経験として残ることも重要な目的の一つとする。大人が決めた行程をただ一緒に移動するだけではなく、子ども自身が景色や施設、食べ物、遊び、人との関わりに興味を持ち、自分なりに感じたり、選んだり、楽しんだりする時間を確保する。観光地や遊園地では、子どもが興味を示したものを可能な範囲で尊重し、初めて見るもの、初めて体験すること、家族以外の大人や他の家族と一緒に過ごすことなどを通じて、新しい経験を積む機会とする。また、写真や会話などを通じて記録を残し、旅行後に家族で振り返ることができるようにすることで、その場限りではなく、成長の過程に残る思い出となることを目指す。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        大人については、各家庭の保護者のみが子どもの対応を担うのではなく、参加する大人全員が同じ旅行グループの一員として、可能な範囲で相互に協力するものとする。移動時の安全確認、荷物の持ち運び、食事時の補助、休憩の確保、子どもの見守り、周囲の状況確認などについて、それぞれが無理のない範囲で自然に補い合うことにより、特定の保護者や特定の一人に負担が集中しないよう配慮する。家族で参加する者と単身で参加する者の立場の違いについても、役割を固定的に分けるのではなく、それぞれができることを行い、必要な場面では声を掛け合いながら、全体として安全かつ円滑に旅行を進めることを基本とする。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        さらに、二つの家族が一緒に旅行することにより、子ども同士だけでなく、大人と子ども、家族と家族の間にも普段とは異なる交流が生まれることが期待される。子どもにとって、家庭以外の大人と接することや、他の家庭の子どもと一緒に行動することは、日常生活の中では得にくい経験の一つである。そのため、大人は安全を確保しつつ過度に介入しすぎず、子ども同士が自然に関わり、遊び、話し、それぞれの方法で旅行を楽しむことができる環境を整えることを意識する。同時に、他者と一緒に行動する中で、順番を守ること、待つこと、譲ること、相手の気持ちを考えることなどを経験し、社会性や協調性を自然な形で学ぶ機会となることも期待する。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        行程の運営にあたっては、事前に設定した予定を尊重しつつも、予定どおりに進めること自体を旅行の成功条件とはしない。道路状況、天候、混雑、施設の営業状況、参加者の体調、子どもの疲労度、食事の時間、休憩の必要性その他の事情により、出発時刻や滞在時間、訪問先、食事場所等を変更する必要が生じる可能性がある。その場合は、当初計画との差異を問題視するのではなく、その時点で参加者全員にとって最も安全で負担が少なく、かつ旅行全体を楽しむことのできる選択肢を検討する。特に子どもの状態に変化が見られる場合には、予定の消化よりも休息、安全、体調回復を優先する。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        食事についても、単に予定された店舗で決められた時間に食べることのみを重視するのではなく、参加者それぞれの空腹状況、子どもの食べられる量や好み、体調、移動時間等を考慮しながら柔軟に判断する。旅行中の食事は重要な楽しみの一つであるため、地域の名物や普段とは異なる料理を楽しむ機会を持ちつつ、子どもが無理なく食事をとることができること、大人も落ち着いて食事を楽しむことができることを両立させる。また、食事の時間が遅くなることや、予定した店に入れない場合なども想定し、必要に応じて別の選択肢を選ぶことで、食事そのものが負担や不満の原因とならないよう配慮する。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        宿泊については、移動や観光によって蓄積した疲労を回復し、翌日の行動に備えるための時間として位置づけるとともに、普段とは異なる環境で全員が一緒に過ごす貴重な交流の場として捉える。子どもが安心して休むことのできる環境を確保し、必要に応じて早めに休ませるなど、各家庭の生活リズムや子どもの状態を尊重する。また、大人についても、翌日の運転や行動に支障が出ないよう十分な休息を確保し、安全に旅行を継続できる状態を保つことを優先する。宿泊先では施設の利用ルールや周囲への配慮を守り、参加者全員が気持ちよく過ごせるよう節度ある行動を心掛ける。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0 0 12px;">
        本旅行を通じて得られる成果は、旅行中の楽しさだけではなく、帰宅後にも残る関係性や記憶にあるものと考える。旅行中に撮影した写真、食事の思い出、子どもの反応、予想外の出来事、移動中の会話などが、後日参加者同士で振り返ることのできる共通の話題となり、その後の交流につながることを期待する。また、子どもたちが成長した後にも、家族以外の人たちと一緒に旅行した経験として記憶に残り、家族や周囲の人との関係を身近に感じる一つのきっかけとなることを目指す。
      </p>
      <p style="font-size:12px;line-height:1.95;color:#53606a;margin:0;">
        以上を踏まえ、本旅行における最も重要な到達目標は、予定したすべての場所を訪問することや、計画どおりの時刻で行動することではなく、大人も子どももそれぞれの立場で安心して旅行を楽しみ、参加者全員が安全かつ健康な状態で帰宅することである。そのうえで、二つの家族および単身参加の二名の大人が一つの旅行をともにしたことで、参加者同士の理解と親しみがこれまで以上に深まり、子どもたちにとっても楽しく安心できる思い出が残り、大人にとっても日常から少し離れた時間を共有したことが今後の関係をより良くする契機となることを、本旅行の最終的かつ総合的な目的とする。
      </p>`;
    cover.insertAdjacentElement('afterend',purpose);
  }

  const pack=doc.querySelector('.pack');
  if(pack){
    const items=[...pack.children];
    if(items.length>=11){
      const order=[0,1,2,3,4,8,9,10,5,6,7];
      order.forEach(i=>pack.appendChild(items[i]));
    }
  }
  const ver=doc.querySelector('.version');
  if(ver) ver.textContent='VERSION 3 / LATEST';
  doc.querySelectorAll('script').forEach(s=>s.remove());
  document.head.innerHTML=doc.head.innerHTML;
  document.body.innerHTML=doc.body.innerHTML;
  const names=['group_trip','excited','travel_guide','happy_man','discussion'];
  const ill={};
  await Promise.all(names.map(async n=>{
    const b64=(await (await fetch(`assets/${n}.b64`)).text()).trim();
    ill[n]=`data:image/webp;base64,${b64}`;
  }));
  document.querySelectorAll('img[data-ill]').forEach(img=>{img.src=ill[img.dataset.ill]||'';});
})();
</script>
</body>
</html>
