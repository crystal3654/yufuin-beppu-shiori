<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>修学旅行のしおり｜湯布院・別府</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#e9ecef}iframe{display:block}</style>
</head>
<body>
<iframe id="book" src="version3-latest.html?v=202609131340" title="修学旅行のしおり"></iframe>
<script>
const frame=document.getElementById('book');
const IMG='https://raw.githubusercontent.com/crystal3654/yufuin-beppu-shiori/main/assets/images/FC760586-6327-4D57-96DC-EB1F8C6999F9.png';

function insertSlogan(){
  const d=frame.contentDocument;
  if(!d) return false;
  const cover=d.querySelector('.cover');
  if(!cover) return false;
  let section=d.getElementById('slogan');
  if(section) return true;
  section=d.createElement('section');
  section.className='sheet';
  section.id='slogan';
  section.innerHTML=`<div style="text-align:center;margin-bottom:10px;font-size:11px;letter-spacing:.14em;color:#66727c;font-weight:800;">TRAVEL SLOGAN</div><img src="${IMG}" alt="考えるより感じろ" style="display:block;width:100%;height:auto;border-radius:4px;background:#f8f7f3;">`;
  cover.insertAdjacentElement('afterend',section);
  return true;
}

frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d) return;
  const observer=new MutationObserver(()=>insertSlogan());
  observer.observe(d.documentElement,{childList:true,subtree:true});
  insertSlogan();
  const timer=setInterval(()=>{
    if(insertSlogan()) clearInterval(timer);
  },100);
  setTimeout(()=>clearInterval(timer),15000);
});
</script>
</body>
</html>
