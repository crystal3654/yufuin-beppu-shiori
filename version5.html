<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修学旅行のしおり</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}iframe{display:block}</style></head>
<body>
<iframe id="book" src="version4.html?v=202609131415"></iframe>
<script>
const f=document.getElementById('book');
f.addEventListener('load',()=>{
  const inner=f.contentDocument?.getElementById('book');
  if(!inner) return;
  inner.addEventListener('load',()=>{
    const d=inner.contentDocument;
    if(!d) return;
    const rows=[...d.querySelectorAll('.row')];
    const row=rows.find(r=>r.querySelector('.time')?.textContent.trim()==='8:15'&&r.querySelector('h3')?.textContent.trim()==='体調確認');
    if(!row||d.getElementById('health-big')) return;
    const img=d.createElement('img');
    img.id='health-big';
    img.src='assets/images/B324BFD1-65A3-4653-8D1D-3AE27DB8DDB5.jpeg';
    img.alt='体調確認の挿絵';
    img.style.cssText='display:block;width:150px;max-width:48%;height:auto;margin:10px auto 2px;border-radius:6px;';
    row.querySelector('.detail')?.appendChild(img);
  });
});
</script>
</body>
</html>
